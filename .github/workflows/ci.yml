name: StudyTogether CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          ./server/package-lock.json
          ./ai/package-lock.json
          ./client/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd server
        npm ci

    - name: Run Backend Tests
      run: |
        cd server
        npm test

    - name: Install AI Dependencies
      run: |
        cd ai
        npm ci

    - name: Run AI Tests
      run: |
        cd ai
        npm test

    - name: Install Client Dependencies
      run: |
        cd client
        npm ci

    - name: Validate Client Lint
      run: |
        cd client
        npm run lint

    - name: Validate Client Production Build
      run: |
        cd client
        npm run build
